<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♟️ Murabbiy CRM</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React va ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_BOOKS = [
      { id: 1, title: 'Step 2 Thinking', totalTopics: 17 },
      { id: 2, title: 'Step 3 Combinations', totalTopics: 20 },
      { id: 3, title: 'Endgame Basics', totalTopics: 12 }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'
      const [usernameInput, setUsernameInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [coachNameInput, setCoachNameInput] = useState('');
      const [authError, setAuthError] = useState('');

      const [activeTab, setActiveTab] = useState('students');
      const [students, setStudents] = useState([]);
      const [showAddModal, setShowAddModal] = useState(false);

      // Form
      const [formData, setFormData] = useState({
        name: '', age: '', phone: '', lichessUsername: '',
        initialDiagnosis: '', threeMonthGoal: ''
      });

      // Jurnal
      const [journalDate, setJournalDate] = useState(new Date().toISOString().split('T')[0]);
      const [topicNote, setTopicNote] = useState('');
      const [selectedTopicNum, setSelectedTopicNum] = useState('');

      // Avtomatik sessiyani tekshirish
      useEffect(() => {
        const savedSession = localStorage.getItem('chess_crm_active_coach');
        if (savedSession) {
          const coach = JSON.parse(savedSession);
          setCurrentUser(coach);
          loadCoachData(coach.username);
        }
      }, []);

      const loadCoachData = (username) => {
        const savedStudents = localStorage.getItem(`chess_crm_students_${username}`);
        if (savedStudents) {
          setStudents(JSON.parse(savedStudents));
        } else {
          const defaultData = [
            {
              id: '1',
              name: 'Ali Vohidov',
              age: '11',
              phone: '+998 90 123 45 67',
              lichessUsername: 'MagnusCarlsen',
              initialDiagnosis: 'Italiya partiyasini biladi, shoshqaloq',
              threeMonthGoal: 'Step 2 ni tugatish & 1400 Blitz',
              completedTopics: 6,
              currentBookId: 1,
              attendance: {}
            }
          ];
          setStudents(defaultData);
          localStorage.setItem(`chess_crm_students_${username}`, JSON.stringify(defaultData));
        }
      };

      const saveStudents = (newStudents) => {
        setStudents(newStudents);
        if (currentUser) {
          localStorage.setItem(`chess_crm_students_${currentUser.username}`, JSON.stringify(newStudents));
        }
      };

      const handleAuth = (e) => {
        e.preventDefault();
        setAuthError('');
        const coaches = JSON.parse(localStorage.getItem('chess_crm_coaches') || '{}');

        if (authMode === 'register') {
          if (coaches[usernameInput]) {
            setAuthError('Ushbu login band. Boshqa login tanlang.');
            return;
          }
          const newCoach = { username: usernameInput, password: passwordInput, name: coachNameInput || usernameInput };
          coaches[usernameInput] = newCoach;
          localStorage.setItem('chess_crm_coaches', JSON.stringify(coaches));
          localStorage.setItem('chess_crm_active_coach', JSON.stringify(newCoach));
          setCurrentUser(newCoach);
          loadCoachData(newCoach.username);
        } else {
          const coach = coaches[usernameInput];
          if (!coach || coach.password !== passwordInput) {
            setAuthError('Login yoki parol notoʻgʻri!');
            return;
          }
          localStorage.setItem('chess_crm_active_coach', JSON.stringify(coach));
          setCurrentUser(coach);
          loadCoachData(coach.username);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('chess_crm_active_coach');
        setCurrentUser(null);
        setUsernameInput('');
        setPasswordInput('');
        setCoachNameInput('');
      };

      const handleAddStudent = (e) => {
        e.preventDefault();
        const newStudent = {
          ...formData,
          id: Date.now().toString(),
          completedTopics: 0,
          currentBookId: 1,
          attendance: {}
        };
        const updated = [...students, newStudent];
        saveStudents(updated);
        setShowAddModal(false);
        setFormData({ name: '', age: '', phone: '', lichessUsername: '', initialDiagnosis: '', threeMonthGoal: '' });
      };

      const toggleAttendance = (studentId, status) => {
        const updated = students.map((s) => {
          if (s.id === studentId) {
            return {
              ...s,
              attendance: {
                ...s.attendance,
                [journalDate]: {
                  status,
                  topic: selectedTopicNum ? `${selectedTopicNum}-mavzu` : '',
                  note: topicNote
                }
              }
            };
          }
          return s;
        });
        saveStudents(updated);
      };

      const handleTopicProgress = (studentId, delta) => {
        const updated = students.map((s) => {
          if (s.id === studentId) {
            const currentBook = INITIAL_BOOKS.find(b => b.id === s.currentBookId) || INITIAL_BOOKS[0];
            let nextTopics = s.completedTopics + delta;
            let nextBookId = s.currentBookId;

            if (nextTopics >= currentBook.totalTopics) {
              nextTopics = 0;
              nextBookId = s.currentBookId + 1 <= INITIAL_BOOKS.length ? s.currentBookId + 1 : s.currentBookId;
            } else if (nextTopics < 0) {
              nextTopics = 0;
            }

            return { ...s, completedTopics: nextTopics, currentBookId: nextBookId };
          }
          return s;
        });
        saveStudents(updated);
      };

      // LOGIN / REGISTRATSIYA EKRANI
      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-sm space-y-4 shadow-xl">
              <div className="text-center space-y-1">
                <h1 className="text-2xl font-bold text-emerald-400">♟️ Murabbiy CRM</h1>
                <p className="text-xs text-slate-400">
                  {authMode === 'login' ? 'Murabbiy kabinetiga kirish' : 'Yangi murabbiy roʻyxatdan oʻtish'}
                </p>
              </div>

              {authError && (
                <div className="bg-rose-500/20 border border-rose-500/50 p-2.5 rounded-xl text-xs text-rose-300 text-center">
                  {authError}
                </div>
              )}

              <form onSubmit={handleAuth} className="space-y-3">
                {authMode === 'register' && (
                  <input
                    required
                    type="text"
                    placeholder="Ism Familiyangiz"
                    value={coachNameInput}
                    onChange={(e) => setCoachNameInput(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                  />
                )}
                <input
                  required
                  type="text"
                  placeholder="Login"
                  value={usernameInput}
                  onChange={(e) => setUsernameInput(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                />
                <input
                  required
                  type="password"
                  placeholder="Parol"
                  value={passwordInput}
                  onChange={(e) => setPasswordInput(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                />
                <button
                  type="submit"
                  className="w-full bg-emerald-500 hover:bg-emerald-600 py-2.5 rounded-xl text-sm font-bold text-white transition shadow-lg mt-2"
                >
                  {authMode === 'login' ? 'Kirish' : 'Roʻyxatdan oʻtish'}
                </button>
              </form>

              <div className="text-center pt-2">
                <button
                  onClick={() => { setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(''); }}
                  className="text-xs text-slate-400 hover:text-emerald-400 transition"
                >
                  {authMode === 'login' ? 'Yangi murabbiymisiz? Roʻyxatdan oʻting' : 'Akkauntingiz bormi? Tizimga kiring'}
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ASOSIY DASHBOARD
      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-900 flex flex-col pb-24 sm:max-w-xl md:max-w-2xl border-x border-slate-800">
          {/* Header */}
          <header className="p-4 bg-slate-800/80 backdrop-blur-md border-b border-slate-700 flex justify-between items-center sticky top-0 z-10">
            <div>
              <h1 className="text-base font-bold text-emerald-400">♟️ {currentUser.name}</h1>
              <p className="text-[11px] text-slate-400">@{currentUser.username} • Murabbiy</p>
            </div>
            <div className="flex gap-2">
              <button
                onClick={() => setShowAddModal(true)}
                className="bg-emerald-500 hover:bg-emerald-600 px-3 py-1.5 rounded-xl text-white text-xs font-bold transition shadow-md"
              >
                + Oʻquvchi
              </button>
              <button
                onClick={handleLogout}
                className="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-xl text-slate-300 text-xs font-medium transition"
              >
                Chiqish
              </button>
            </div>
          </header>

          {/* Kontent */}
          <main className="p-4 flex-1">
            {/* 1. O'quvchilar & Diagnostika */}
            {activeTab === 'students' && (
              <div className="space-y-4">
                <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Mening Oʻquvchilarim ({students.length})</h2>
                {students.length === 0 ? (
                  <p className="text-xs text-slate-500 text-center py-6">Hozircha oʻquvchilar yoʻq. + tugmasini bosib qoʻshing.</p>
                ) : (
                  students.map((st) => (
                    <div key={st.id} className="bg-slate-800 border border-slate-700 p-4 rounded-2xl space-y-2">
                      <div className="flex justify-between items-start">
                        <div>
                          <h3 className="font-bold text-base text-white">{st.name}</h3>
                          <p className="text-xs text-slate-400">{st.age} yosh • {st.phone}</p>
                        </div>
                        {st.lichessUsername && (
                          <a
                            href={`https://lichess.org/@/${st.lichessUsername}`}
                            target="_blank"
                            rel="noreferrer"
                            className="bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded-lg text-xs font-medium text-emerald-300 transition"
                          >
                            Lichess ↗
                          </a>
                        )}
                      </div>
                      <div className="bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/50 space-y-1 text-xs">
                        <p><span className="text-emerald-400 font-semibold">Boshlangʻich holat:</span> {st.initialDiagnosis || 'Kiritilmagan'}</p>
                        <p><span className="text-sky-400 font-semibold">3 oylik maqsad:</span> {st.threeMonthGoal || 'Kiritilmagan'}</p>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {/* 2. Tezkor Jurnal */}
            {activeTab === 'journal' && (
              <div className="space-y-4">
                <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                  <label className="text-xs font-semibold text-slate-400">Dars Sanasi</label>
                  <input
                    type="date"
                    value={journalDate}
                    onChange={(e) => setJournalDate(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                  />
                  <div className="grid grid-cols-2 gap-2">
                    <input
                      type="text"
                      placeholder="Mavzu № (masalan: 2)"
                      value={selectedTopicNum}
                      onChange={(e) => setSelectedTopicNum(e.target.value)}
                      className="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white"
                    />
                    <input
                      type="text"
                      placeholder="Qisqa izoh"
                      value={topicNote}
                      onChange={(e) => setTopicNote(e.target.value)}
                      className="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white"
                    />
                  </div>
                </div>

                <div className="space-y-2">
                  {students.map((st) => {
                    const dayStatus = st.attendance?.[journalDate]?.status;
                    return (
                      <div key={st.id} className="bg-slate-800 border border-slate-700 p-3 rounded-xl flex items-center justify-between">
                        <div>
                          <p className="font-semibold text-sm">{st.name}</p>
                          {st.attendance?.[journalDate]?.topic && (
                            <p className="text-[10px] text-slate-400">{st.attendance[journalDate].topic}</p>
                          )}
                        </div>
                        <div className="flex gap-2">
                          <button
                            onClick={() => toggleAttendance(st.id, 'present')}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                              dayStatus === 'present' ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-400'
                            }`}
                          >
                            ✓ Keldi
                          </button>
                          <button
                            onClick={() => toggleAttendance(st.id, 'absent')}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                              dayStatus === 'absent' ? 'bg-rose-600 text-white' : 'bg-slate-700 text-slate-400'
                            }`}
                          >
                            ✕ Kelmadi
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* 3. Kitoblar Progress-bari */}
            {activeTab === 'books' && (
              <div className="space-y-4">
                <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Kitoblar Progressi</h2>
                {students.map((st) => {
                  const currentBook = INITIAL_BOOKS.find(b => b.id === st.currentBookId) || INITIAL_BOOKS[0];
                  const percent = Math.round((st.completedTopics / currentBook.totalTopics) * 100);
                  return (
                    <div key={st.id} className="bg-slate-800 border border-slate-700 p-4 rounded-2xl space-y-3">
                      <div className="flex justify-between items-center">
                        <div>
                          <h3 className="font-bold text-white text-base">{st.name}</h3>
                          <p className="text-xs text-emerald-400 font-medium">{currentBook.title}</p>
                        </div>
                        <span className="text-sm font-bold bg-slate-900 border border-slate-700 px-2 py-1 rounded-lg text-emerald-400">
                          {percent}%
                        </span>
                      </div>

                      <div className="w-full bg-slate-900 rounded-full h-3 border border-slate-700/60 overflow-hidden">
                        <div
                          className="bg-emerald-500 h-full transition-all duration-300"
                          style={{ width: `${percent}%` }}
                        />
                      </div>

                      <div className="flex justify-between items-center text-xs text-slate-400 pt-1">
                        <span>{st.completedTopics} / {currentBook.totalTopics} mavzu</span>
                        <div className="flex gap-2">
                          <button
                            onClick={() => handleTopicProgress(st.id, -1)}
                            className="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded-lg font-bold text-white"
                          >
                            -1
                          </button>
                          <button
                            onClick={() => handleTopicProgress(st.id, 1)}
                            className="bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded-lg font-bold text-white"
                          >
                            +1 Mavzu
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          {/* Yangi oʻquvchi qoʻshish modali */}
          {showAddModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 p-5 rounded-2xl w-full max-w-sm space-y-4 max-h-[90vh] overflow-y-auto">
                <h3 className="text-lg font-bold text-white">Yangi Oʻquvchi Anketasi</h3>
                <form onSubmit={handleAddStudent} className="space-y-3">
                  <input
                    required
                    type="text"
                    placeholder="F.I.O"
                    value={formData.name}
                    onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                  />
                  <div className="grid grid-cols-2 gap-2">
                    <input
                      type="number"
                      placeholder="Yoshi"
                      value={formData.age}
                      onChange={(e) => setFormData({ ...formData, age: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white"
                    />
                    <input
                      type="text"
                      placeholder="Telefon"
                      value={formData.phone}
                      onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white"
                    />
                  </div>
                  <input
                    type="text"
                    placeholder="Lichess username"
                    value={formData.lichessUsername}
                    onChange={(e) => setFormData({ ...formData, lichessUsername: e.target.value })}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white"
                  />
                  <textarea
                    placeholder="Boshlangʻich holat (debyutlar, kamchiliklar)"
                    rows={2}
                    value={formData.initialDiagnosis}
                    onChange={(e) => setFormData({ ...formData, initialDiagnosis: e.target.value })}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white"
                  />
                  <textarea
                    placeholder="3 oylik maqsad"
                    rows={2}
                    value={formData.threeMonthGoal}
                    onChange={(e) => setFormData({ ...formData, threeMonthGoal: e.target.value })}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white"
                  />
                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowAddModal(false)}
                      className="flex-1 bg-slate-700 py-2.5 rounded-xl text-sm font-semibold text-slate-300"
                    >
                      Bekor qilish
                    </button>
                    <button
                      type="submit"
                      className="flex-1 bg-emerald-500 hover:bg-emerald-600 py-2.5 rounded-xl text-sm font-semibold text-white"
                    >
                      Saqlash
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Bottom Bar */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md sm:max-w-xl md:max-w-2xl mx-auto bg-slate-800/90 backdrop-blur-md border-t border-slate-700 flex justify-around p-2">
            <button
              onClick={() => setActiveTab('students')}
              className={`flex flex-col items-center gap-1 p-2 text-xs font-semibold ${
                activeTab === 'students' ? 'text-emerald-400' : 'text-slate-400'
              }`}
            >
              👥 Oʻquvchilar
            </button>
            <button
              onClick={() => setActiveTab('journal')}
              className={`flex flex-col items-center gap-1 p-2 text-xs font-semibold ${
                activeTab === 'journal' ? 'text-emerald-400' : 'text-slate-400'
              }`}
            >
              📅 Jurnal
            </button>
            <button
              onClick={() => setActiveTab('books')}
              className={`flex flex-col items-center gap-1 p-2 text-xs font-semibold ${
                activeTab === 'books' ? 'text-emerald-400' : 'text-slate-400'
              }`}
            >
              📖 Kitoblar
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
