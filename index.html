<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Chess Coach UZ</title>

  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      margin: 0;
      padding: 0;
      min-height: 100%;
      width: 100%;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #07111f;
      color: #f8fafc;

      -webkit-tap-highlight-color: transparent;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================
       APP
    ========================================= */

    .app {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top right,
          rgba(16,185,129,.10),
          transparent 30%
        ),
        #07111f;
    }

    /* =========================================
       TOPBAR
    ========================================= */

    .topbar {
      height: 72px;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(15,23,42,.96);
      border-bottom: 1px solid #1e293b;

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #10b981;
      color: white;

      border-radius: 13px;

      font-size: 28px;
      font-weight: 900;

      box-shadow:
        0 8px 25px rgba(16,185,129,.25);
    }

    .brand strong {
      display: block;
      font-size: 17px;
      font-weight: 900;
    }

    .brand small {
      display: block;
      margin-top: 2px;

      color: #34d399;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;

      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
    }

    .logout-btn {
      border: 1px solid rgba(244,63,94,.3);
      background: rgba(244,63,94,.08);
      color: #fb7185;

      padding: 9px 14px;
      border-radius: 10px;

      font-size: 12px;
      font-weight: 800;
    }

    .logout-btn:hover {
      background: rgba(244,63,94,.18);
    }

    /* =========================================
       LAYOUT
    ========================================= */

    .layout {
      display: flex;
      min-height: calc(100vh - 72px);
    }

    .sidebar {
      width: 245px;
      flex-shrink: 0;

      padding: 18px;

      background: #0f172a;
      border-right: 1px solid #1e293b;
    }

    .sidebar button {
      width: 100%;

      border: 0;
      background: transparent;
      color: #94a3b8;

      text-align: left;

      padding: 13px 15px;
      margin-bottom: 6px;

      border-radius: 12px;

      font-size: 13px;
      font-weight: 700;

      transition: .18s;
    }

    .sidebar button:hover {
      background: #172033;
      color: #e2e8f0;
    }

    .sidebar button.active {
      background: #10b981;
      color: white;

      box-shadow:
        0 8px 22px rgba(16,185,129,.18);
    }

    .content {
      flex: 1;
      min-width: 0;

      padding: 30px;

      max-width: 1400px;
    }

    /* =========================================
       DASHBOARD
    ========================================= */

    .welcome-card {
      padding: 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      background:
        linear-gradient(
          135deg,
          rgba(16,185,129,.10),
          rgba(15,23,42,.95)
        );

      border: 1px solid #1e293b;
      border-radius: 24px;

      margin-bottom: 20px;
    }

    .welcome-card span {
      display: inline-block;

      padding: 6px 10px;

      border-radius: 999px;

      background: rgba(16,185,129,.10);
      border: 1px solid rgba(16,185,129,.25);

      color: #34d399;

      font-size: 10px;
      font-weight: 800;
    }

    .welcome-card h1 {
      margin: 10px 0 4px;

      font-size: 28px;
      font-weight: 900;
    }

    .welcome-card p {
      margin: 0;

      color: #94a3b8;
      font-size: 13px;
    }

    .live-btn,
    .main-btn {
      border: 0;

      background: #10b981;
      color: white;

      padding: 13px 18px;

      border-radius: 13px;

      font-size: 13px;
      font-weight: 900;

      box-shadow:
        0 10px 25px rgba(16,185,129,.20);
    }

    .live-btn {
      background: #f43f5e;
      box-shadow:
        0 10px 25px rgba(244,63,94,.20);
    }

    .main-btn.small {
      padding: 10px 14px;
      margin-top: 15px;
    }

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 14px;

      margin-bottom: 20px;
    }

    .stat {
      background: #0f172a;

      border: 1px solid #1e293b;
      border-radius: 18px;

      padding: 20px;
    }

    .stat span {
      display: block;
      font-size: 22px;
      margin-bottom: 8px;
    }

    .stat b {
      display: block;

      font-size: 24px;
      font-weight: 900;
    }

    .stat small {
      display: block;

      margin-top: 3px;

      color: #64748b;
      font-size: 11px;
      font-weight: 700;
    }

    .quick-card {
      background: #0f172a;

      border: 1px solid #1e293b;
      border-radius: 22px;

      padding: 25px;
    }

    .quick-card h2 {
      margin: 0 0 8px;

      font-size: 19px;
      font-weight: 900;
    }

    .quick-card p {
      color: #94a3b8;
      font-size: 13px;
      margin: 0;
    }

    /* =========================================
       LOGIN
    ========================================= */

    .login-page {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at center,
          rgba(16,185,129,.10),
          transparent 35%
        ),
        #020617;
    }

    .login-box {
      width: 100%;
      max-width: 410px;

      padding: 32px;

      background: #0f172a;
      border: 1px solid #1e293b;

      border-radius: 28px;

      box-shadow:
        0 30px 80px rgba(0,0,0,.35);
    }

    .logo-big {
      width: 72px;
      height: 72px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0 auto 15px;

      background: rgba(16,185,129,.10);
      border: 1px solid rgba(16,185,129,.25);

      border-radius: 20px;

      color: #34d399;
      font-size: 42px;
    }

    .login-box h1 {
      text-align: center;

      margin: 0;

      font-size: 25px;
      font-weight: 900;
    }

    .login-subtitle {
      text-align: center;

      color: #64748b;

      font-size: 12px;

      margin: 6px 0 25px;
    }

    .login-box label {
      display: block;

      color: #94a3b8;

      font-size: 10px;
      font-weight: 800;

      margin: 13px 0 6px;

      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .login-box input {
      width: 100%;

      border: 1px solid #1e293b;

      background: #020617;
      color: white;

      padding: 13px 14px;

      border-radius: 12px;

      outline: none;
    }

    .login-box input:focus {
      border-color: #10b981;
    }

    .login-box .main-btn {
      width: 100%;
      margin-top: 18px;
    }

    .error-box {
      padding: 11px;

      background: rgba(244,63,94,.10);
      border: 1px solid rgba(244,63,94,.25);

      color: #fb7185;

      border-radius: 11px;

      font-size: 12px;
      font-weight: 700;
    }

    .demo-login {
      margin-top: 20px;
      padding: 12px;

      background: #020617;

      border-radius: 12px;

      color: #64748b;

      font-size: 10px;
      line-height: 1.7;
    }

    /* =========================================
       CHESS
    ========================================= */

    .chess-area {
      width: 100%;
    }

    .board-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 20px;
    }

    .board-header h2 {
      margin: 0;

      font-size: 24px;
      font-weight: 900;
    }

    .board-header p {
      margin: 5px 0 0;

      color: #34d399;
      font-size: 12px;
      font-weight: 700;
    }

    .reset-btn {
      border: 1px solid #334155;

      background: #0f172a;
      color: #cbd5e1;

      padding: 10px 14px;

      border-radius: 11px;

      font-size: 12px;
      font-weight: 800;
    }

    .board-wrapper {
      display: flex;
      justify-content: center;

      position: relative;

      padding-left: 20px;
    }

    .chess-board {
      width: min(78vw, 650px);
      aspect-ratio: 1 / 1;

      display: grid;

      grid-template-columns:
        repeat(8, 1fr);

      grid-template-rows:
        repeat(8, 1fr);

      overflow: hidden;

      border: 7px solid #334155;
      border-radius: 16px;

      box-shadow:
        0 25px 70px rgba(0,0,0,.40);
    }

    .square {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      min-width: 0;
      min-height: 0;

      transition: filter .12s;
    }

    .square:hover {
      filter: brightness(1.08);
    }

    .light-square {
      background: #f0d9b5;
    }

    .dark-square {
      background: #b58863;
    }

    .selected-square {
      box-shadow:
        inset 0 0 0 5px #facc15;
    }

    /*
      SHAXMAT DONALARI

      Hammasi bir xil o'lchamda.
      Emoji emas, Unicode chess belgilaridan foydalanadi.
    */

    .chess-piece {
      width: 82%;
      height: 82%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        "DejaVu Sans",
        "Segoe UI Symbol",
        serif;

      font-size: clamp(25px, 6vw, 65px);

      line-height: 1;

      user-select: none;

      transform: translateY(-1%);
    }

    .piece-white {
      color: #fff;

      text-shadow:
        0 2px 0 #111827,
        2px 0 0 #111827,
        -2px 0 0 #111827,
        0 -2px 0 #111827,
        0 5px 8px rgba(0,0,0,.45);
    }

    .piece-black {
      color: #111827;

      text-shadow:
        0 2px 1px rgba(255,255,255,.20),
        0 4px 7px rgba(0,0,0,.45);
    }

    .coordinates-left {
      position: absolute;

      left: 0;

      width: 20px;

      height: 100%;

      display: flex;
      flex-direction: column;
      justify-content: space-around;

      color: #94a3b8;

      font-size: 10px;
      font-weight: 800;
    }

    .file-coordinate {
      position: absolute;

      right: 5px;
      bottom: 3px;

      font-size: 9px;
      font-weight: 900;

      color: rgba(0,0,0,.45);

      pointer-events: none;
    }

    .piece-info {
      max-width: 650px;

      margin: 20px auto 0;

      display: grid;

      grid-template-columns:
        repeat(6, 1fr);

      gap: 8px;
    }

    .piece-card {
      padding: 9px 4px;

      display: flex;
      flex-direction: column;
      align-items: center;

      background: #0f172a;

      border: 1px solid #1e293b;
      border-radius: 11px;
    }

    .piece-card span {
      font-size: 25px;

      line-height: 1;
    }

    .piece-card small {
      margin-top: 4px;

      color: #64748b;

      font-size: 9px;
      font-weight: 800;
    }

    /* =========================================
       EMPTY
    ========================================= */

    .empty-page {
      min-height: 400px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      background: #0f172a;

      border: 1px solid #1e293b;
      border-radius: 24px;
    }

    .empty-page > div {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .empty-page h2 {
      margin: 0;

      font-size: 22px;
      font-weight: 900;
    }

    .empty-page p {
      color: #64748b;
      font-size: 12px;
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 800px) {

      .topbar {
        height: 64px;
        padding: 0 14px;
      }

      .brand-logo {
        width: 38px;
        height: 38px;
        font-size: 24px;
      }

      .brand strong {
        font-size: 14px;
      }

      .user-area > span {
        display: none;
      }

      .layout {
        display: block;
      }

      .sidebar {
        width: 100%;

        display: grid;
        grid-template-columns:
          repeat(2, 1fr);

        gap: 5px;

        padding: 8px;

        border-right: 0;
        border-bottom: 1px solid #1e293b;
      }

      .sidebar button {
        margin: 0;
        padding: 10px;

        font-size: 11px;
      }

      .content {
        padding: 15px;
      }

      .welcome-card {
        flex-direction: column;
        align-items: flex-start;

        padding: 20px;
      }

      .welcome-card h1 {
        font-size: 22px;
      }

      .live-btn {
        width: 100%;
      }

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .stat {
        padding: 15px;
      }

      .stat b {
        font-size: 19px;
      }

      .board-header {
        align-items: flex-start;
      }

      .board-header h2 {
        font-size: 19px;
      }

      .chess-board {
        width: calc(100vw - 48px);

        border-width: 5px;
        border-radius: 10px;
      }

      .board-wrapper {
        padding-left: 17px;
      }

      .coordinates-left {
        width: 17px;
      }

      .piece-info {
        grid-template-columns:
          repeat(3, 1fr);
      }

      .piece-card span {
        font-size: 22px;
      }

    }

    @media (max-width: 430px) {

      .login-box {
        padding: 24px 18px;
      }

      .sidebar {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .chess-board {
        width: calc(100vw - 38px);
      }

      .chess-piece {
        font-size: clamp(22px, 10vw, 42px);
      }

    }

  </style>
</head>

<body>

  <div id="root"></div>

  <script>
    if (
      window.Telegram &&
      window.Telegram.WebApp
    ) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>

  <!-- MUHIM: app.js shu nom bilan saqlangan bo'lishi kerak -->
  <script
    type="text/babel"
    src="app.js"
  ></script>

</body>
</html>
